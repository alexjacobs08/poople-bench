name: daily-benchmark

on:
  schedule:
    - cron: "20 8 * * *" # 20 min after the 08:00 UTC puzzle flip
  workflow_dispatch:

concurrency:
  group: daily-benchmark
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Check OpenRouter balance (fail loudly if broke)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          left=$(curl -sf https://openrouter.ai/api/v1/credits -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['data']; print(d['total_credits']-d['total_usage'])")
          echo "credits remaining: \$$left"
          python3 -c "import sys; sys.exit(0 if float('$left') >= 2.0 else 1)" \
            || { echo '::error::OpenRouter balance below \$2 — top up at https://openrouter.ai/credits or the daily run will 402'; exit 1; }
      - name: Run today's puzzle (per-model trial counts)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: uv run poople-bench daily
      - name: Aggregate leaderboard
        run: uv run poople-bench aggregate
      - name: Commit results
        run: |
          git config user.name "poople-bench-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/
          git diff --cached --quiet || git commit -m "results: daily run $(date -u +%F)"
          git push
  deploy:
    needs: run
    uses: ./.github/workflows/pages.yml
    permissions:
      pages: write
      id-token: write
      contents: read
