[project]
name = "poople-bench"
version = "0.1.0"
description = "Daily LLM benchmark on Poople: one-shot word ladders to POOP, scored against provable optimal"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pydantic>=2.7"]

[project.scripts]
poople-bench = "poople_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poople_bench"]

[dependency-groups]
dev = ["pytest>=8"]
